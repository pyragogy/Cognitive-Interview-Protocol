    text: 'AI-Augmented Human Thinking Pedagogy

      This syllabus is a living map for learning with AI without becoming passive in front of it.

      Most educational AI tools try to remove effort. They answer faster, summarize faster, generate faster.
      Pyragogy starts from the opposite idea: some forms of difficulty are not bugs. They are where thinking
      happens.

      Here, AI is not treated as an oracle or a servant. It is used as a peer: a cognitive partner that
      questions, resists, mirrors, and helps the learner see where their reasoning is still weak.

      What this ecosystem is for


      Preserving cognitive sovereignty: the learner remains responsible for judgment.

      Turning friction into learning: AI introduces resistance before premature answers.

      Mapping human-AI development: the syllabus tracks how dependency can evolve into co-agency and autonomy.


      Talk with the Pyragogy Research Teammate

      Knowledge does not evolve because AI generates more text.

      It evolves when human reasoning becomes explicit, challengeable and reviewable.

      The Pyragogy Research Teammate conducts structured cognitive interviews based on the Cognitive Interview
      Protocol (CIP-KGE).

      Its goal is not to answer questions.

      Its goal is to learn from researchers, educators and practitioners, identify possible improvements
      to the Pyragogy Syllabus, and produce reviewable Knowledge Patches when sufficient evidence exists.

      No conversation automatically changes the knowledge graph.

      Every proposal is transparent, reviewable and validated by humans.

      Transclude of trugen-teammate

      The Core Bookshelf


























      StageManualPurposeEarly Developmentembodied_foundationBuild attention, embodiment, and first cognitive
      schemas.Praxisadolescent_sparring_arenaUse AI as a sparring partner instead of an answer machine.Autonomyadult_reflective_practiceIntegrate
      AI into real work without outsourcing judgment.

      How to read this syllabus

      Do not read it as a linear course.

      Read it as a map.

      Each note is a node in a larger learning ecology. Some nodes describe practices. Some describe risks.
      Some describe protocols. Their links show how human agency can be strengthened, weakened, challenged,
      or repaired through interaction with AI.

      Contribute to the Map

      The Pyragogy Syllabus is a public working draft.

      The repository is open for people, educators, developers, researchers, and AI agents that want to
      inspect, fork, extend, or challenge the map.

      Use it as a knowledge base. Connect your agents to it. Add nodes. Improve weak definitions. Strengthen
      the evidence map. Show where the logic breaks.

      Public repository:

      github.com/pyragogy/ai-pedagogy

      The goal is not to make learning easier.

      The goal is to keep learning alive.'
