      Reading Logic

      The syllabus is not a linear textbook. It is a developmental graph.

      Each node should answer four questions:


      What human capacity is being protected?

      What AI failure mode is being resisted?

      What kind of friction is introduced?

      What observable behavior proves that learning is happening?

