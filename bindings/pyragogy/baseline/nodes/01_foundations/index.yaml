sections:
  body:
    text: 'The epistemic principles that underpin Pyragogy: the axis system used to map human-AI co-learning,
      the relation grammar that defines how concepts connect, and the architectural blueprint of the framework.

      Core Documents


      blueprint — The architectural blueprint of the Pyragogy framework: what it is, what it is not, and
      how its components interlock.

      cartesian_axes — The three measurement axes (Ontogeny, Praxis, Autonomy) used to position every
      node in the epistemic space.

      epistemic_relation_grammar — The formal vocabulary of relations between nodes: reinforces, contradicts,
      enables, threatens, and more.


      Purpose

      These three documents are the load-bearing walls of the framework. Read them before navigating any
      other section: they define the coordinate system that gives the rest of the graph its shape.'
