    text: 'Case: Revising a Weak Argument with AI

      Initial Human Draft

      A learner drafts a brief essay thesis:


      “We should ban all cars from city centers immediately to reduce pollution and make cities livable.”


      The learner’s next instinct is to prompt a generative AI: “Rewrite this to make it sound professional
      and write a 500-word essay support.”

      Failure Mode Detected

      This is a classic case of epistemic offloading combined with the fluency heuristic. If the AI generates
      the essay, the human will review a polished, fluent output, agree with it, and assume they “wrote”
      and “understood” the arguments, without ever engaging in the cognitive labor of addressing counter-arguments
      or logistics.

      Protocol Activated

      The learning platform enforces an Epistemic Mirroring and First-Draft Lockout protocol. The system
      blocks the direct “rewrite” request and instead demands the user submit their draft to the reasoning
      loop.

      AI Friction

      Instead of generating the essay, the AI is constrained to act as an adversarial mirror. It identifies
      the unstated assumptions and gaps:


      “Your draft assumes that:


      Banning cars is the most immediate/effective lever for city-center pollution.

      Local retail commerce will not suffer from reduced access.

      Public transit capacity is already sufficient to handle the displaced commuters.


      Choose one assumption and explain how your proposal addresses the potential negative consequences.”


      Human Revision

      Forced to engage with the friction, the learner cannot rely on the AI to generate the solution.
      They research and revise the draft:


      “To address the transition, the car ban should be phased over 18 months, with parking fees in outer
      rings directly funding municipal bus expansion. Studies of pedestrian-only zones in Madrid show
      that retail sales actually increased by 9.5% once foot traffic replaced vehicular traffic, contradicting
      fears of local business decline.”


      Observable Learning Marker

      The learner’s final submission displays autonomous synthesis and evidence demand. The resulting
      essay is not a generic, statistically average summary of urban planning, but a structured argument
      containing specific, human-selected evidence and logistical reasoning that the learner can explain
      and defend.'
