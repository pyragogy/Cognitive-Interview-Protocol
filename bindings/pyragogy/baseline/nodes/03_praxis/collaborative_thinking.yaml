content_hash: sha256:29c3402ceff1970e11b1f0854fc8cf2975f29e0963f16021ab77934830db1e13
sections:
  definition:
    text: Collaborative Prototyping is a co-creation protocol where the AI agent operates as a cross-functional
      analyst and strategic partner within a complex design or engineering environment. It does not automate
      silent execution but engages in joint action (hybrid intelligence).
    hash: sha256:21eb831cba5576328f10d4d05db222f6f3ded082b574601d149724bc280442d0
  use_case:
    text: Activated in professional and lifelong learning environments when the practitioner must scale
      complex systems, generate design variations, or explore structural edge cases.
    hash: sha256:37ede62bcb7a0eb938a64c7e2ff32148722cbbde69f115c2d488186e09c8e8ef
  human_role:
    text: Maintains primary strategic control. Injects qualitative judgment, aesthetic taste, and ethical
      alignment into decisions. The highest level of technical and moral decision-making cannot be delegated.
    hash: sha256:367cce26d0c296bac74ac817326c27fea6e80098182cd9da1b26d6097feba706
  ai_role:
    text: Acts as a computational Devil’s Advocate. It generates divergent variations, performs structural
      consistency checks, detects rapid patterns, and actively challenges human assumptions in real time.
    hash: sha256:88f69f3c9651ff3d3eda69e67d3ff3e8fd1495760bd0a6fde196d20eeeebf428
  friction:
    text: Interrupts invisible automation and the Expertise Reversal Effect by inserting calibrated cognitive
      obstacles that force the expert to justify choices rather than passively relying on algorithmic
      output.
    hash: sha256:67ab406be3bf00fb2e178df40f76e84baa188a06e22c6128f218379afb91d653
  risk:
    text: 'If this practice is absent, teams incur ai_over_reliance and cognitive debt: the professional
      stops understanding the deep architecture of the solutions they approve.'
    hash: sha256:24b2bf64123b626579b259adcc15d1881fb9d225e3a3915ff4bc7f07f471ad55
  observable_markers:
    text: The professional integrates, partially rejects, and documents the versions generated by the
      AI, demonstrating through direct modifications to the code or design that they critically evaluated
      the output before final use.
    hash: sha256:f6d805d1603b2a58489cbfce63dc6b3defa6aa50dfbffb366c90c07f97ed578c
