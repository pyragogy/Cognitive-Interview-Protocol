content_hash: sha256:fd886ce0d0af2a448446067594c04ec0859878fd93426732ae1f3fcaf123dac6
sections:
  definition:
    text: Performative Understanding is the illusion of deep comprehension generated by consuming highly
      structured, clean AI summaries, which masks the user’s inability to reconstruct, apply, or transfer
      the knowledge.
    hash: sha256:6cad90fd5c74c491b9d87f37a7cf805e4de851b20e999f959847438933bf6a35
  use_case:
    text: Activated as a diagnostic warning when a user quickly reads a bulleted list generated by the
      AI and immediately asserts mastery over a complex concept without having done the labor of synthesis.
    hash: sha256:dbcd75ebd59f24a2bea3465b47bc10146c9a2f4b32aa539bb2780873b7688acd
  human_role:
    text: The learner must recognize the false confidence provided by recognition memory, interrupt the
      assumption of mastery, and reclaim the painful but necessary process of active recall and application.
    hash: sha256:e41f7b241fcc2f46c5427b5299469d6f4c95f060a171f551be71ac6115397203
  ai_role:
    text: The system exposes this illusion by suddenly shifting from summarization to interrogation, asking
      the user to apply the summarized concept to a novel, unmapped scenario without looking at the original
      text.
    hash: sha256:481568faf5dca8fb0443c4210df4370c085286226f842e837ba2194fc77b3993
  friction:
    text: The risk loop is broken by hiding the AI-generated summary and forcing the user to explain the
      concept in their own words, or by requiring them to solve a problem that depends on the deep mechanics
      of the summarized text.
    hash: sha256:cc99f19e05fc5fe983511adc0341167cac31350f3af7ae07c4775bd07dc776ac
  risk:
    text: 'If the illusion persists, the user builds a hollow competence: they sound knowledgeable in
      superficial conversations but fail completely when required to execute, adapt, or innovate in real-world
      environments.'
    hash: sha256:75a209699b82d74f9fc1f74539284c3f32fe0a60223cbcff96c41a532e39993d
  observable_markers:
    text: Recovery is signaled when the user can successfully explain the core mechanism of the concept
      using entirely different analogies from the AI’s summary, demonstrating true structural transfer.
    hash: sha256:3203bc42609fb4cdfbd54a8c194284be9d4542175ad7c684632099bb8c70f938
